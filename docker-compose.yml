services:
  # Base de datos relacional PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: laboratorio_postgres
    restart: always
    environment:
      POSTGRES_DB: laboratorio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d laboratorio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Spring Boot 3 con Spring Security y JWT
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laboratorio_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/laboratorio_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 86400000
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  # Frontend Angular
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: laboratorio_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
